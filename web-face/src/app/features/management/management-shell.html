<div class="management-page" [class.dark-theme]="darkMode()">
  <header class="management-header">
    <button type="button" class="back-button" (click)="backToMap()">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z" />
      </svg>
      <span>Management</span>
    </button>

    <div class="header-actions">
      <button
        class="icon-button round"
        type="button"
        aria-label="Toggle dark mode"
        [class.active]="darkMode()"
        [attr.aria-pressed]="darkMode()"
        (click)="toggleDarkMode()"
      >
        @if (darkMode()) {
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              fill="currentColor"
              d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4A9.06 9.06 0 0 0 12 3z"
            />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20">
            <circle cx="12" cy="12" r="4" fill="currentColor" />
            <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </g>
          </svg>
        }
      </button>
      <button class="avatar" type="button" aria-label="Account">F</button>
    </div>
  </header>

  <div class="management-body">
    <nav class="management-sidebar">
      @for (group of navGroups; track group.label) {
        <div class="nav-group">
          <span class="nav-group-label">{{ group.label }}</span>
          <ul class="nav-list">
            @for (child of group.children; track child.path) {
              <li>
                <a class="nav-link nav-link-child" [routerLink]="child.path" routerLinkActive="active">
                  {{ child.label }}
                </a>
              </li>
            }
          </ul>
        </div>
      }

      <ul class="nav-list">
        @for (link of navLinks; track link.path) {
          <li>
            <a class="nav-link" [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <main class="management-content">
      <router-outlet />
    </main>
  </div>
</div>
