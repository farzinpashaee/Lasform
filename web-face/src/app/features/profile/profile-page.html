<div class="auth-page">
  <div class="auth-card">
    <button type="button" class="back-link" (click)="backToMap()">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      <span>{{ 'profile.backToMap' | transloco }}</span>
    </button>

    <h1 class="auth-title">{{ 'profile.title' | transloco }}</h1>

    <div class="avatar-section">
      <div class="avatar-preview">
        @if (avatarPreview()) {
          <img [src]="avatarPreview()" alt="" referrerpolicy="no-referrer" />
        } @else {
          <span>{{ accountLetter() }}</span>
        }
      </div>
      <div class="avatar-actions">
        <label class="avatar-upload-button" [class.disabled]="avatarSaving()">
          {{ (avatarSaving() ? 'common.saving' : 'profile.changePhoto') | transloco }}
          <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" [disabled]="avatarSaving()" (change)="onAvatarFileSelected($event)" hidden />
        </label>
        @if (hasCustomAvatar()) {
          <button type="button" class="avatar-remove-button" [disabled]="avatarSaving()" (click)="removeAvatar()">
            {{ 'profile.removePhoto' | transloco }}
          </button>
        }
      </div>
      <p class="avatar-hint">{{ 'profile.avatarHint' | transloco }}</p>
      @if (avatarError()) {
        <p class="auth-error">{{ avatarError() }}</p>
      }
    </div>

    <label class="auth-field">
      <span>{{ 'common.email' | transloco }}</span>
      <input type="email" [value]="email()" disabled />
    </label>

    <form (ngSubmit)="save()">
      <label class="auth-field">
        <span>{{ 'profile.displayName' | transloco }}</span>
        <input
          type="text"
          [(ngModel)]="displayName"
          (ngModelChange)="onFieldChange()"
          name="displayName"
          required
          autocomplete="name"
          [placeholder]="'profile.displayNamePlaceholder' | transloco"
        />
      </label>

      @if (error()) {
        <p class="auth-error">{{ error() }}</p>
      }

      <div class="auth-actions">
        <button type="submit" class="auth-submit" [disabled]="saving() || !displayName().trim()">
          {{ (saving() ? 'common.saving' : 'common.save') | transloco }}
        </button>
        @if (saved()) {
          <span class="auth-saved-note">{{ 'profile.saved' | transloco }}</span>
        }
      </div>
    </form>

    <button type="button" class="sign-out-link" (click)="signOut()">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>
      <span>{{ 'common.logout' | transloco }}</span>
    </button>
  </div>
</div>
