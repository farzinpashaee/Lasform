<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">{{ 'auth.resetPassword.title' | transloco }}</h1>
    <p class="auth-subtitle">{{ 'auth.resetPassword.subtitle' | transloco }}</p>

    <form (ngSubmit)="submit()">
      <label class="auth-field">
        <span>{{ 'auth.resetPassword.newPassword' | transloco }}</span>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="8" autocomplete="new-password" />
      </label>

      <label class="auth-field">
        <span>{{ 'auth.resetPassword.confirmPassword' | transloco }}</span>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </label>

      @if (error()) {
        <p class="auth-error">{{ error() }}</p>
      }

      <button type="submit" class="auth-submit" [disabled]="submitting() || newPassword().length < 8 || !confirmPassword()">
        {{ (submitting() ? 'auth.resetPassword.submitting' : 'auth.resetPassword.submit') | transloco }}
      </button>
    </form>
  </div>
</div>
