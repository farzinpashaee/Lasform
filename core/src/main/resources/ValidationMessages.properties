# Bean-validation (jakarta.validation) messages, keyed from each entity's @NotBlank/@NotNull/@Email
# {message = "{...}"} attribute. Hibernate Validator's default interpolator picks this bundle up
# automatically (by convention) and resolves it locale-aware via Spring's LocaleContextHolder, which
# LocaleConfig's LocaleResolver populates per request — no extra wiring needed.
#
# To add a locale: copy this file to ValidationMessages_xx.properties and translate the values.

validation.geofence.name.required=must not be blank
validation.geofence.ownerId.required=must not be null
validation.geofence.shape.required=must not be null

validation.event.type.required=must not be null
validation.event.source.required=must not be null
validation.event.point.required=must not be null
validation.event.occurredAt.required=must not be null

validation.location.point.required=must not be null
validation.location.recordedAt.required=must not be null

validation.alert.deviceId.required=must not be blank
validation.alert.type.required=must not be null
validation.alert.triggeredAt.required=must not be null

validation.category.name.required=must not be blank

validation.device.deviceIdentifier.required=must not be blank
validation.device.name.required=must not be blank
validation.device.ownerId.required=must not be null
validation.device.type.required=must not be null

validation.auth.email.required=must not be blank
validation.auth.email.invalid=must be a well-formed email address
validation.auth.password.required=must not be blank
validation.auth.password.tooShort=must be at least 8 characters
validation.auth.refreshToken.required=must not be blank
validation.auth.roleId.required=must not be blank
