# Default (English) application messages, resolved by GlobalExceptionHandler via
# MessageSource + the request's Locale (see LocaleConfig). Bean-validation messages
# ({@code @NotBlank(message = "{...}")} etc.) live separately in ValidationMessages.properties,
# per jakarta.validation convention.
#
# To add a locale: copy this file to messages_xx.properties, translate the values (keep the
# {0}/{1} placeholders), and add the Locale to LocaleConfig.SUPPORTED_LOCALES.

# Entity not-found (generic CRUD lookups)
error.category.notFound=Category not found: {0}
error.device.notFound=Device not found: {0}
error.location.notFound=Location not found: {0}
error.alert.notFound=Alert not found: {0}
error.geofence.notFound=Geofence not found: {0}
error.event.notFound=Event not found: {0}
error.user.notFound=User not found: {0}
error.role.notFound=Role not found: {0}

# Entity-specific lookups
error.category.notFoundByName=Category not found with name: {0}
error.device.notFoundByIdentifier=Device not found with identifier: {0}

# Duplicates
error.category.duplicateName=Category name already in use: {0}
error.device.duplicateIdentifier=Device identifier already registered: {0}
error.user.duplicateEmail=Email already in use: {0}

# Images
error.image.notFound=Image not found: {0}
error.image.alreadyExists=An image named ''{0}'' already exists
error.image.uploadRequired=File must not be empty
error.image.invalidContentType=File must be an image, got content type: {0}
error.image.ownerIdRequired=Owner id must not be blank
error.image.invalidOwnerId=Invalid owner id: {0}
error.image.invalidFilename=Invalid filename: {0}
error.image.filenameRequired=Filename must not be blank

# Query/search parameter validation
error.alert.filterRequired=At least one of 'deviceId' or 'status' must be provided
error.event.filterRequired=Provide 'deviceId', 'userId', or 'type' together with 'from' and 'to'
error.geofence.filterRequired=At least one of 'ownerId', 'status' or 'deviceId' must be provided
error.search.pageNegative='page' must not be negative
error.search.sizeOutOfRange=''size'' must be between 1 and {0}
error.tag.limitOutOfRange=''limit'' must be between 1 and {0}

# Generic HTTP-layer errors
error.upload.tooLarge=Uploaded file exceeds the maximum allowed size
error.param.typeMismatch=Invalid value for parameter ''{0}'': {1}
error.validation.failed=Validation failed
