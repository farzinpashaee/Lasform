server:
  port: 8078
spring:
  application:
    name: lasform

  # Backs GlobalExceptionHandler's message-code resolution (see LocaleConfig for the
  # LocaleResolver that picks the request's Locale from Accept-Language).
  messages:
    basename: messages
    encoding: UTF-8
    # Without this, a missing key silently falls back to whatever locale the JVM/OS
    # happens to be running under instead of the base (English) bundle, which is
    # non-deterministic across environments.
    fallback-to-system-locale: false

  # Connection settings live under spring.mongodb.* (not spring.data.mongodb.*) as of
  # Spring Boot 4's MongoProperties/DataMongoProperties split. Getting this prefix wrong
  # fails silently: Boot falls back to its built-in default URI (mongodb://localhost/test)
  # instead of failing to start, so the app "works" but writes to the wrong database.
  mongodb:
    uri: mongodb://localhost:27018/lasform
    database: lasform

  # spring.data.mongodb.* is the Spring Data behavior prefix. @Indexed/@GeoSpatialIndexed/
  # @CompoundIndex on the entities are otherwise inert: Spring Data Mongo does not create
  # indexes from annotations unless this is set.
  data:
    mongodb:
      auto-index-creation: true
    web:
      pageable:
        # Spring's built-in default is 2000 — the map view paginates through every Location
        # to render all markers with no artificial cap, which needs a page size above that
        # default max when the collection is large.
        max-page-size: 20000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Only 'health' is exposed — SecurityConfig's anyRequest().permitAll() means anything listed here is
# publicly reachable with no auth, same as every other endpoint in this app. Never add 'env', 'beans',
# 'configprops', etc. here: they'd leak lasform.jwt.secret / the Mongo URI to anyone. show-details
# defaults to 'never' for the same reason — left unset deliberately, don't override it to 'always'.
management:
  endpoints:
    web:
      exposure:
        include: health

lasform:
  storage:
    images:
      # Factory defaults only — an admin can override all three from the General Settings page
      # (config_entries, see ImageStorageSettingsService) without a restart.
      # Root directory Location/Device images are stored under, one subfolder per entity id.
      base-path: ./data/images
      # Per-image cap (see ImageStorageProperties) — keep at or below multipart.max-file-size above.
      max-file-size: 5MB
      # Only extensions in ImageStorageSettingsService.SUPPORTED_EXTENSIONS actually take effect.
      allowed-extensions: jpg,jpeg,png

  seed:
    # Runs AuthSeeder on startup: (re)syncs the fixed Permission catalog and the 5 system roles
    # every run (idempotent — safe to leave on), and creates the single Organization + initial
    # SUPER_ADMIN user once, only if none exist yet. Also gates ConfigDefaultsSeeder below. Set to
    # false for e.g. a read replica or a test profile that shouldn't write on boot.
    enabled: true

  config-defaults:
    # Optional operator-supplied seed values for specific generic config_entries (see
    # ConfigDefaultsSeeder) — copied in once on first startup if that key has no entry yet; the
    # admin Settings UI owns the value from then on, even across restarts, env var changes, or
    # removal. Blank (the default) means "don't seed, leave it for an admin to set via the UI."
    google-maps-api-key:
    google-sso-client-id:

  org:
    # Name of the single organization AuthSeeder creates on first run.
    name: Lasform

  admin:
    # Initial SUPER_ADMIN account, created once on first run. Deliberately left blank here —
    # never hardcode credentials. Set via the LASFORM_ADMIN_EMAIL / LASFORM_ADMIN_PASSWORD
    # environment variables (or an external secrets store that injects them the same way). If
    # both are still unset the first time the app starts with no users in the database,
    # AuthSeeder logs a warning and skips creating the admin account rather than guessing.
    email:
    password:

  jwt:
    # HMAC-SHA256 signing key for access/refresh tokens — at least 32 characters. Deliberately
    # left blank here: never hardcode a signing secret. Set via LASFORM_JWT_SECRET for any
    # deployment that needs tokens (and thus sessions) to survive a restart; if left unset,
    # JwtService falls back to a random ephemeral key generated at startup (logged as a warning)
    # so the app still runs locally without extra setup, at the cost of invalidating every
    # existing token on each restart.
    secret:
    # Simple duration syntax (Spring's DurationStyle): e.g. 15m, 1h, 7d.
    access-token-ttl: 15m
    refresh-token-ttl: 7d